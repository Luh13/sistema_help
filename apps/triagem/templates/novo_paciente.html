{% extends 'base-triagem.html' %}
{% block title %}Cadastrar Novo Paciente{% endblock %}
{% block content %}
    <div class="container vh-100">
        <h1 class="mt-5">
            Cadastrar Novo Paciente
        </h1>
        <hr>
        {% if error %}<p>{{error}}</p>{% endif%}
        <form action="" method="POST">
            {% csrf_token %}
            <div class="col-12">
                <label for="username" class="form-label">
                    Nome
                </label>
                <input type="text" class="form-control" name="username" required>
            </div>
            <div class="col-12">
                <label for="cpf" class="form-control" name="cpf">
                    CPF
                </label>
                <input type="cpf" class="form-control" name="cpf" required>
            </div>
              <div class="col-12">
                <label for="datanascimento" class="form-control" name="datanascimento">
                    Data de nascimento
                </label>
                <input type="date" class="form-control" name="datanascimento" required>
            </div>
            <div class="d-flex justify-content-center mt-5">
                <button type="submit" class="btn btn-success col-4">
                    Cadastrar
                </button>
            </div>
        </form>
    </div>
{% endblock %}
